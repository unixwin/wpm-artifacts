name: mirror-gawk

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'gawk version (ezwinports file tag, e.g. 5.4.1)'
        required: true
        default: '5.4.1'
      revision:
        description: 'our repackaging revision (Debian style: <version>-unixwin<N>)'
        required: true
        default: '1'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      # Upstream version stays visible; our rebuild carries the revision the
      # index compares (wpm orders <version>-unixwin<N> above <version>).
      PKG: gawk-${{ inputs.version }}-unixwin${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v4

      - name: Download upstream (ezwinports @ SourceForge)
        run: |
          V="${{ inputs.version }}"
          URL="https://downloads.sourceforge.net/project/ezwinports/gawk-${V}-w32-bin.zip"
          curl -fL --retry 3 -o gawk.zip "$URL"
          test "$(stat -c%s gawk.zip)" -gt 1000000 || { echo 'download too small, likely blocked'; exit 1; }

      - name: Inspect and repackage
        run: |
          mkdir extract && cd extract
          unzip -o ../gawk.zip
          echo '--- zip layout ---'
          find . -maxdepth 2 | sort
          # ezwinports ships the whole 32-bit runtime next to gawk.exe; two of
          # those DLLs are not in any import table (gawk.exe pulls libgmp-10,
          # libmpfr-6 and libreadline8 only — measured with dumpbin on
          # 2026-10-16), so drop the dead ~1.5 MB instead of shipping it:
          #   libncurses6.dll    (no importer)
          #   libgcc_s_dw2-1.dll (no importer; 32-bit GCC runtime)
          # Match by name: the upstream archive lays the runtime out under
          # bin/ (and gawk extensions under lib/), which has moved between
          # repackagings of the same upstream file.
          find . \( -iname libncurses6.dll -o -iname libgcc_s_dw2-1.dll \) -delete -print
          # gawk's optional extension modules (lib/gawk/ext-*/: filefuncs,
          # inplace, ...) are @load-ed explicitly and the index maps none of
          # them - the old asset did not carry them either, so shipping them
          # would only inflate the download.
          rm -rf lib/gawk/ext-* && echo 'pruned lib/gawk/ext-*'
          cd ..
          (cd extract && zip -r "../${PKG}-win-x64.zip" .)

      - name: Manifest
        run: |
          Z="${PKG}-win-x64.zip"
          sha256sum "$Z" | tee sha256.txt
          stat -c%s "$Z" | tee size.txt
          # 记录包内 DLL 清单,供索引 files 映射与 review 使用
          (cd extract && find . -iname '*.dll' | sed 's|^\./||' | sort) > dlls.txt
          cat dlls.txt

      - name: Verify DLL completeness
        run: |
          # x86 二进制在 ubuntu 上无 objdump PE 支持时跳过;CI 可换用 mingw objdump
          if command -v objdump >/dev/null && file extract/gawk.exe | grep -qi pe32; then
            bash repackage/check-dll-deps.sh extract || { echo 'DLL check failed'; exit 1; }
          else
            echo 'skip native PE inspection on linux runner (see dlls.txt for manual review)'
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PKG }}
          name: gawk ${{ inputs.version }} (unixwin${{ inputs.revision }})
          body: |
            Repackaged mirror of ezwinports gawk-${{ inputs.version }}-w32-bin.zip
            (32-bit build, runs on x64 via WOW64).
            Upstream: https://sourceforge.net/projects/ezwinports/files/gawk-${{ inputs.version }}-w32-bin.zip

            Repackaging revision unixwin${{ inputs.revision }}: the payload keeps only the
            DLLs the binaries import — libncurses6.dll and libgcc_s_dw2-1.dll have no
            importer and are dropped (~1.5 MB). niubash's wpm preinstall pins this
            version, so the index entry's `files` mapping must match this asset.
          files: |
            ${{ env.PKG }}-win-x64.zip
            sha256.txt
            size.txt
            dlls.txt
