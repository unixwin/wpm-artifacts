name: build-ncat

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nmap version (installer is nmap-<version>-setup.exe, e.g. 7.991)'
        required: true
        default: '7.991'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install p7zip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full > /dev/null

      - name: Download official Nmap installer (native MSVC build)
        run: |
          V="${{ inputs.version }}"
          curl -fL --retry 3 -o nmap-setup.exe "https://nmap.org/dist/nmap-${V}-setup.exe"
          test "$(stat -c%s nmap-setup.exe)" -gt 10000000 || { echo 'installer too small'; exit 1; }

      # NSIS 安装器可直接解包,无需安装。ncat.exe 为官方原生构建,
      # 运行时仅需同目录的 OpenSSL 3 / libssh2 / zlib DLL(已本地验证明文+SSL 收发)。
      - name: Extract ncat.exe + runtime DLLs
        run: |
          mkdir dist
          7z e -y nmap-setup.exe \
            ncat.exe libssl-3.dll libcrypto-3.dll libssh2.dll zlibwapi.dll \
            -odist > /dev/null
          test -f dist/ncat.exe || { echo 'ncat.exe not found in installer'; exit 1; }
          ls -l dist/

      - name: Package and manifest
        run: |
          Z="ncat-${{ inputs.version }}-win-x64.zip"
          (cd dist && zip -r "../$Z" .)
          sha256sum "$Z" | tee sha256.txt
          stat -c%s "$Z" | tee size.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ncat-${{ inputs.version }}
          name: ncat ${{ inputs.version }}
          body: |
            Official native Windows ncat.exe extracted from the unmodified Nmap installer
            (nmap-${{ inputs.version }}-setup.exe, https://nmap.org/dist/).
            Includes OpenSSL 3 / libssh2 / zlib runtime DLLs. Verified: plain TCP + --ssl echo.
            License: Nmap Open Source License (https://nmap.org/npsl/).
          files: |
            ncat-${{ inputs.version }}-win-x64.zip
            sha256.txt
            size.txt
